<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Comparison of shared schema, schema per tenant and database per tenant for SaaS multi-tenancy" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Comparison of shared schema, schema per tenant and database per tenant for SaaS multi-tenancy</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="658" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Three ways to isolate tenant data</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Isolation goes up, and so do cost and operational weight</tspan></text><rect x="50" y="130" width="350" height="420" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="74" y="174" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="74" dy="0">Shared schema</tspan></text><text x="74" y="204" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="74" dy="0">One database, one set of tables</tspan></text><g transform="translate(74,230)"><rect x="0" y="0" width="302" height="140" rx="10" fill="#eef2f0" stroke="#cfd9d4" stroke-width="2"/><g transform="translate(16,16)"><rect x="0" y="0" width="270" height="22" rx="4" fill="#47b48c"/><rect x="0" y="28" width="270" height="22" rx="4" fill="#e8a50c"/><rect x="0" y="56" width="270" height="22" rx="4" fill="#6aa8d8"/><rect x="0" y="84" width="270" height="22" rx="4" fill="#47b48c"/></g></g><line x1="74" y1="388" x2="376" y2="388" stroke="#cfd9d4" stroke-width="1.5"/><text x="74" y="416" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="74" dy="0">Isolation</tspan></text><text x="376" y="416" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="376" dy="0">Logical (code + RLS)</tspan></text><line x1="74" y1="438" x2="376" y2="438" stroke="#cfd9d4" stroke-width="1.5"/><text x="74" y="466" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="74" dy="0">Cost per tenant</tspan></text><text x="376" y="466" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="376" dy="0">Lowest</tspan></text><line x1="74" y1="488" x2="376" y2="488" stroke="#cfd9d4" stroke-width="1.5"/><text x="74" y="516" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="74" dy="0">Operations</tspan></text><text x="376" y="516" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="376" dy="0">Simplest</tspan></text><rect x="425" y="130" width="350" height="420" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="449" y="174" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="449" dy="0">Schema per tenant</tspan></text><text x="449" y="204" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="449" dy="0">One database, a schema for each</tspan></text><g transform="translate(449,230)"><rect x="0" y="0" width="302" height="140" rx="10" fill="#eef2f0" stroke="#cfd9d4" stroke-width="2"/><rect x="14" y="16" width="86" height="108" rx="8" fill="#ffffff" stroke="#47b48c" stroke-width="3"/><rect x="24" y="30" width="66" height="14" rx="3" fill="#47b48c"/><rect x="24" y="54" width="66" height="14" rx="3" fill="#47b48c"/><rect x="24" y="78" width="66" height="14" rx="3" fill="#47b48c"/><rect x="108" y="16" width="86" height="108" rx="8" fill="#ffffff" stroke="#e8a50c" stroke-width="3"/><rect x="118" y="30" width="66" height="14" rx="3" fill="#e8a50c"/><rect x="118" y="54" width="66" height="14" rx="3" fill="#e8a50c"/><rect x="118" y="78" width="66" height="14" rx="3" fill="#e8a50c"/><rect x="202" y="16" width="86" height="108" rx="8" fill="#ffffff" stroke="#6aa8d8" stroke-width="3"/><rect x="212" y="30" width="66" height="14" rx="3" fill="#6aa8d8"/><rect x="212" y="54" width="66" height="14" rx="3" fill="#6aa8d8"/><rect x="212" y="78" width="66" height="14" rx="3" fill="#6aa8d8"/></g><line x1="449" y1="388" x2="751" y2="388" stroke="#cfd9d4" stroke-width="1.5"/><text x="449" y="416" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="449" dy="0">Isolation</tspan></text><text x="751" y="416" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="751" dy="0">Stronger</tspan></text><line x1="449" y1="438" x2="751" y2="438" stroke="#cfd9d4" stroke-width="1.5"/><text x="449" y="466" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="449" dy="0">Cost per tenant</tspan></text><text x="751" y="466" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="751" dy="0">Medium</tspan></text><line x1="449" y1="488" x2="751" y2="488" stroke="#cfd9d4" stroke-width="1.5"/><text x="449" y="516" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="449" dy="0">Operations</tspan></text><text x="751" y="516" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="751" dy="0">Migrations x N</tspan></text><rect x="800" y="130" width="350" height="420" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="824" y="174" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="824" dy="0">Database per tenant</tspan></text><text x="824" y="204" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="824" dy="0">Fully separate databases</tspan></text><g transform="translate(824,230)"><rect x="0" y="0" width="94" height="140" rx="12" fill="#ffffff" stroke="#47b48c" stroke-width="3"/><ellipse cx="47" cy="30" rx="30" ry="10" fill="#47b48c"/><rect x="17" y="46" width="60" height="14" rx="3" fill="#47b48c" opacity="0.7"/><rect x="17" y="70" width="60" height="14" rx="3" fill="#47b48c" opacity="0.7"/><rect x="17" y="94" width="60" height="14" rx="3" fill="#47b48c" opacity="0.7"/><rect x="104" y="0" width="94" height="140" rx="12" fill="#ffffff" stroke="#e8a50c" stroke-width="3"/><ellipse cx="151" cy="30" rx="30" ry="10" fill="#e8a50c"/><rect x="121" y="46" width="60" height="14" rx="3" fill="#e8a50c" opacity="0.7"/><rect x="121" y="70" width="60" height="14" rx="3" fill="#e8a50c" opacity="0.7"/><rect x="121" y="94" width="60" height="14" rx="3" fill="#e8a50c" opacity="0.7"/><rect x="208" y="0" width="94" height="140" rx="12" fill="#ffffff" stroke="#6aa8d8" stroke-width="3"/><ellipse cx="255" cy="30" rx="30" ry="10" fill="#6aa8d8"/><rect x="225" y="46" width="60" height="14" rx="3" fill="#6aa8d8" opacity="0.7"/><rect x="225" y="70" width="60" height="14" rx="3" fill="#6aa8d8" opacity="0.7"/><rect x="225" y="94" width="60" height="14" rx="3" fill="#6aa8d8" opacity="0.7"/></g><line x1="824" y1="388" x2="1126" y2="388" stroke="#cfd9d4" stroke-width="1.5"/><text x="824" y="416" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="824" dy="0">Isolation</tspan></text><text x="1126" y="416" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="1126" dy="0">Strongest</tspan></text><line x1="824" y1="438" x2="1126" y2="438" stroke="#cfd9d4" stroke-width="1.5"/><text x="824" y="466" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="824" dy="0">Cost per tenant</tspan></text><text x="1126" y="466" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="1126" dy="0">Highest</tspan></text><line x1="824" y1="488" x2="1126" y2="488" stroke="#cfd9d4" stroke-width="1.5"/><text x="824" y="516" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="824" dy="0">Operations</tspan></text><text x="1126" y="516" font-size="19" font-weight="700" fill="#17211c" text-anchor="end"><tspan x="1126" dy="0">Most complex</tspan></text><rect x="50" y="572" width="1100" height="56" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="608" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Most products should start shared, then move large or regulated customers to dedicated databases.</tspan></text>
</svg>
