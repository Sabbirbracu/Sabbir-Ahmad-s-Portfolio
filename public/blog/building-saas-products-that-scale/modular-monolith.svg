<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="Architecture diagram of a modular monolith with auth, billing, core domain and notification modules, a database, a queue and a payment provider" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Architecture diagram of a modular monolith with auth, billing, core domain and notification modules, a database, a queue and a payment provider</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="668" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">A modular monolith, deployed as one app</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Clear module boundaries now, an easy path to extract services later</tspan></text><rect x="50" y="200" width="190" height="90" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="145" y="240" font-size="22" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="145" dy="0">Web &amp; mobile</tspan></text><text x="145" y="268" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="145" dy="0">clients</tspan></text><line x1="244" y1="245" x2="300" y2="245" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><rect x="304" y="130" width="560" height="400" rx="18" fill="#e3f1ea" stroke="#176c4f" stroke-width="3"/><text x="334" y="172" font-size="23" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="334" dy="0">One deployable application</tspan></text><rect x="334" y="200" width="244" height="118" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="356" y="246" font-size="24" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="356" dy="0">Auth &amp; orgs</tspan></text><text x="356" y="282" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="356" dy="0">Users, roles, invites</tspan></text><rect x="596" y="200" width="244" height="118" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="618" y="246" font-size="24" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="618" dy="0">Billing</tspan></text><text x="618" y="282" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="618" dy="0">Plans, entitlements</tspan></text><rect x="334" y="350" width="244" height="118" rx="12" fill="#ffffff" stroke="#176c4f" stroke-width="3"/><text x="356" y="396" font-size="24" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="356" dy="0">Core domain</tspan></text><text x="356" y="432" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="356" dy="0">What customers pay for</tspan></text><rect x="596" y="350" width="244" height="118" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="618" y="396" font-size="24" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="618" dy="0">Notifications</tspan></text><text x="618" y="432" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="618" dy="0">Email, in-app, webhooks</tspan></text><text x="334" y="508" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="334" dy="0">Modules talk through plain interfaces, never each other's tables.</tspan></text><rect x="930" y="150" width="220" height="100" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="1040" y="190" font-size="22" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="1040" dy="0">Database</tspan></text><text x="1040" y="220" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="1040" dy="0">Source of truth</tspan></text><rect x="930" y="285" width="220" height="100" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="1040" y="325" font-size="22" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="1040" dy="0">Queue + workers</tspan></text><text x="1040" y="355" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="1040" dy="0">Email, exports, retries</tspan></text><rect x="930" y="420" width="220" height="100" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="1040" y="460" font-size="22" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="1040" dy="0">Object storage</tspan></text><text x="1040" y="490" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="1040" dy="0">Files and uploads</tspan></text><line x1="868" y1="200" x2="926" y2="200" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><line x1="868" y1="335" x2="926" y2="335" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><line x1="868" y1="470" x2="926" y2="470" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="304" y="560" width="560" height="70" rx="12" fill="#ffffff" stroke="#e8a50c" stroke-width="2.5"/><text x="584" y="603" font-size="21" font-weight="700" fill="#17211c" text-anchor="middle"><tspan x="584" dy="0">Payment provider  -&gt;  signed, idempotent webhooks</tspan></text><line x1="584" y1="556" x2="584" y2="534" stroke="#e8a50c" stroke-width="3" marker-end="url(#arr)"/>
</svg>
