<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Subscription lifecycle from trial to active, past due and canceled, with the webhook events that trigger each transition" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Subscription lifecycle from trial to active, past due and canceled, with the webhook events that trigger each transition</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="628" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Subscription lifecycle, driven by webhooks</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Your billing provider is the source of truth. Your app mirrors it</tspan></text><rect x="50" y="200" width="200" height="120" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="3"/><text x="150" y="252" font-size="28" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="150" dy="0">Trial</tspan></text><text x="150" y="290" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="150" dy="0">Limited access</tspan></text><rect x="350" y="200" width="200" height="120" rx="12" fill="#e3f1ea" stroke="#176c4f" stroke-width="3"/><text x="450" y="252" font-size="28" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="450" dy="0">Active</tspan></text><text x="450" y="290" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="450" dy="0">Full access</tspan></text><rect x="650" y="200" width="200" height="120" rx="12" fill="#fdf3d8" stroke="#ecd08a" stroke-width="3"/><text x="750" y="252" font-size="28" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="750" dy="0">Past due</tspan></text><text x="750" y="290" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="750" dy="0">Grace period</tspan></text><rect x="950" y="200" width="200" height="120" rx="12" fill="#fbe6e1" stroke="#e7b9af" stroke-width="3"/><text x="1050" y="252" font-size="28" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="1050" dy="0">Canceled</tspan></text><text x="1050" y="290" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="1050" dy="0">Read-only / export</tspan></text><line x1="254" y1="260" x2="346" y2="260" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><line x1="554" y1="260" x2="646" y2="260" stroke="#5b6b63" stroke-width="4" marker-end="url(#arr)"/><line x1="854" y1="260" x2="946" y2="260" stroke="#5b6b63" stroke-width="4" marker-end="url(#arr)"/><text x="300" y="200" font-size="17" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="300" dy="0">payment</tspan><tspan x="300" dy="20.4">succeeds</tspan></text><text x="600" y="200" font-size="17" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="600" dy="0">payment</tspan><tspan x="600" dy="20.4">fails</tspan></text><text x="900" y="200" font-size="17" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="900" dy="0">retries</tspan><tspan x="900" dy="20.4">exhausted</tspan></text><path d="M750,324 C750,400 450,400 450,324" fill="none" stroke="#176c4f" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrg)"/><text x="600" y="424" font-size="18" font-weight="600" fill="#176c4f" text-anchor="middle"><tspan x="600" dy="0">payment recovered</tspan></text><rect x="50" y="470" width="1100" height="130" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="78" y="512" font-size="20" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="78" dy="0">Webhook events to handle (names as used by Stripe-style providers)</tspan></text><text x="78" y="552" font-size="19" font-weight="400" fill="#176c4f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan x="78" dy="0">invoice.paid</tspan></text><text x="290" y="552" font-size="19" font-weight="400" fill="#9a6a00" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan x="290" dy="0">invoice.payment_failed</tspan></text><text x="640" y="552" font-size="19" font-weight="400" fill="#c2412d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan x="640" dy="0">customer.subscription.deleted</tspan></text><text x="78" y="584" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="78" dy="0">Verify the signature, store the event id, and ignore duplicates, so every handler is idempotent.</tspan></text>
</svg>
