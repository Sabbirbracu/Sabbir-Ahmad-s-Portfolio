<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Workflow diagram: trigger, retrieve context, model, validate, confidence gate, then auto-apply or human review before the system of record" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Workflow diagram: trigger, retrieve context, model, validate, confidence gate, then auto-apply or human review before the system of record</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="648" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">An AI step inside a real workflow</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">The model is one stage, surrounded by checks</tspan></text><rect x="50" y="140" width="196" height="128" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="78" cy="170" r="16" fill="#176c4f"/><text x="78" y="177" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="78" dy="0">1</tspan></text><text x="104" y="178" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="104" dy="0">Trigger</tspan></text><text x="72" y="222" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="72" dy="0">Ticket, email,</tspan><tspan x="72" dy="25.650000000000002">or form</tspan></text><line x1="250" y1="204" x2="278" y2="204" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="282" y="140" width="196" height="128" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="310" cy="170" r="16" fill="#176c4f"/><text x="310" y="177" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="310" dy="0">2</tspan></text><text x="336" y="178" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="336" dy="0">Retrieve</tspan></text><text x="304" y="222" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="304" dy="0">Search your</tspan><tspan x="304" dy="25.650000000000002">docs &amp; data</tspan></text><line x1="482" y1="204" x2="510" y2="204" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="514" y="140" width="196" height="128" rx="14" fill="#176c4f" stroke="#176c4f" stroke-width="2"/><circle cx="542" cy="170" r="16" fill="#e8a50c"/><text x="542" y="177" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="542" dy="0">3</tspan></text><text x="568" y="178" font-size="25" font-weight="800" fill="#fff" text-anchor="start"><tspan x="568" dy="0">Model</tspan></text><text x="536" y="222" font-size="19" font-weight="400" fill="#d4efe3" text-anchor="start"><tspan x="536" dy="0">Draft, classify,</tspan><tspan x="536" dy="25.650000000000002">or extract</tspan></text><line x1="714" y1="204" x2="742" y2="204" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="746" y="140" width="196" height="128" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="774" cy="170" r="16" fill="#176c4f"/><text x="774" y="177" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="774" dy="0">4</tspan></text><text x="800" y="178" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="800" dy="0">Validate</tspan></text><text x="768" y="222" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="768" dy="0">Schema checks +</tspan><tspan x="768" dy="25.650000000000002">business rules</tspan></text><line x1="946" y1="204" x2="974" y2="204" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="978" y="140" width="196" height="128" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="1006" cy="170" r="16" fill="#176c4f"/><text x="1006" y="177" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="1006" dy="0">5</tspan></text><text x="1032" y="178" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="1032" dy="0">Gate</tspan></text><text x="1000" y="222" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="1000" dy="0">Is it safe to</tspan><tspan x="1000" dy="25.650000000000002">act on?</tspan></text><line x1="1076" y1="272" x2="1076" y2="302" stroke="#5b6b63" stroke-width="3"/><line x1="695" y1="302" x2="1076" y2="302" stroke="#5b6b63" stroke-width="3"/><line x1="995" y1="302" x2="1076" y2="302" stroke="#5b6b63" stroke-width="3"/><line x1="695" y1="302" x2="695" y2="330" stroke="#176c4f" stroke-width="3" marker-end="url(#arrg)"/><line x1="995" y1="302" x2="995" y2="330" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="560" y="334" width="270" height="92" rx="12" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><text x="695" y="372" font-size="22" font-weight="800" fill="#176c4f" text-anchor="middle"><tspan x="695" dy="0">High confidence</tspan></text><text x="695" y="404" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="695" dy="0">Apply automatically</tspan></text><rect x="860" y="334" width="270" height="92" rx="12" fill="#fdf3d8" stroke="#ecd08a" stroke-width="2"/><text x="995" y="372" font-size="22" font-weight="800" fill="#9a6a00" text-anchor="middle"><tspan x="995" dy="0">Low confidence</tspan></text><text x="995" y="404" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="995" dy="0">Route to a human</tspan></text><line x1="695" y1="426" x2="695" y2="456" stroke="#176c4f" stroke-width="3"/><line x1="995" y1="426" x2="995" y2="456" stroke="#5b6b63" stroke-width="3"/><line x1="695" y1="456" x2="995" y2="456" stroke="#5b6b63" stroke-width="3"/><line x1="845" y1="456" x2="845" y2="482" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="645" y="484" width="400" height="64" rx="12" fill="#ffffff" stroke="#17211c" stroke-width="2.5"/><text x="845" y="526" font-size="25" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="845" dy="0">System of record</tspan></text><rect x="50" y="306" width="440" height="230" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="76" y="346" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="76" dy="0">Why this shape?</tspan></text><text x="76" y="384" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="76" dy="0">Validate before you trust anything</tspan><tspan x="76" dy="25.080000000000002">the model says.</tspan><tspan x="76" dy="25.080000000000002"></tspan><tspan x="76" dy="25.080000000000002">Low-confidence work goes to people,</tspan><tspan x="76" dy="25.080000000000002">not to production.</tspan><tspan x="76" dy="25.080000000000002"></tspan><tspan x="76" dy="25.080000000000002">Every decision leaves a trail.</tspan></text><rect x="50" y="566" width="1100" height="60" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="603" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Log every input, output and decision: your audit trail, and the raw material for evaluation.</tspan></text>
</svg>
