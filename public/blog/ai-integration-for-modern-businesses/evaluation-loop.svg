<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Evaluation loop: build a golden set, run the system, score results, change one thing, repeat" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Evaluation loop: build a golden set, run the system, score results, change one thing, repeat</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="638" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">The evaluation loop</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">How you change a prompt or model without breaking what works</tspan></text><rect x="110" y="140" width="440" height="130" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="144" cy="176" r="16" fill="#176c4f"/><text x="144" y="183" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="144" dy="0">1</tspan></text><text x="176" y="184" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="176" dy="0">Golden set</tspan></text><text x="138" y="228" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="138" dy="0">50-100 real examples with the</tspan><tspan x="138" dy="27">answer you would accept</tspan></text><rect x="650" y="140" width="440" height="130" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="684" cy="176" r="16" fill="#176c4f"/><text x="684" y="183" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="684" dy="0">2</tspan></text><text x="716" y="184" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="716" dy="0">Run the system</tspan></text><text x="678" y="228" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="678" dy="0">Same inputs, current prompt,</tspan><tspan x="678" dy="27">model and retrieval settings</tspan></text><rect x="650" y="340" width="440" height="130" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="684" cy="376" r="16" fill="#176c4f"/><text x="684" y="383" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="684" dy="0">3</tspan></text><text x="716" y="384" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="716" dy="0">Score</tspan></text><text x="678" y="428" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="678" dy="0">Pass/fail on must-haves, plus a</tspan><tspan x="678" dy="27">rubric for tone and completeness</tspan></text><rect x="110" y="340" width="440" height="130" rx="12" fill="#176c4f" stroke="#176c4f" stroke-width="2"/><circle cx="144" cy="376" r="16" fill="#e8a50c"/><text x="144" y="383" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="144" dy="0">4</tspan></text><text x="176" y="384" font-size="25" font-weight="800" fill="#fff" text-anchor="start"><tspan x="176" dy="0">Change one thing</tspan></text><text x="138" y="428" font-size="20" font-weight="400" fill="#d4efe3" text-anchor="start"><tspan x="138" dy="0">Prompt, model, chunking, or</tspan><tspan x="138" dy="27">a guardrail. Never several at once</tspan></text><line x1="554" y1="205" x2="646" y2="205" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><line x1="870" y1="274" x2="870" y2="336" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><line x1="646" y1="405" x2="554" y2="405" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><line x1="330" y1="336" x2="330" y2="274" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><rect x="50" y="510" width="1100" height="100" rx="12" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><text x="80" y="550" font-size="21" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="80" dy="0">Track on every run</tspan></text><text x="80" y="584" font-size="21" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="80" dy="0">Accuracy · cost per task · latency · how often it escalates to a human</tspan></text>
</svg>
