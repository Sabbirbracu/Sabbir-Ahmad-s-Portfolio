<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 665" width="1200" height="665" role="img" aria-label="Matrix of task volume against cost of a wrong answer, showing which tasks to automate, assist, keep human-led, or skip" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Matrix of task volume against cost of a wrong answer, showing which tasks to automate, assist, keep human-led, or skip</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Where AI integration pays off</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Task volume vs. the cost of a wrong answer</tspan></text><rect x="150" y="130" width="500" height="215" rx="14" fill="#fbe6e1" stroke="#e7b9af" stroke-width="2"/><text x="178" y="178" font-size="27" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="178" dy="0">Keep it human-led</tspan></text><text x="178" y="220" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="178" dy="0">Legal judgment calls</tspan><tspan x="178" dy="30">Medical or financial advice</tspan><tspan x="178" dy="30">One-off strategy decisions</tspan></text><rect x="660" y="130" width="500" height="215" rx="14" fill="#fdf3d8" stroke="#ecd08a" stroke-width="2"/><text x="688" y="178" font-size="27" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="688" dy="0">Assist, with human review</tspan></text><text x="688" y="220" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="688" dy="0">Contract clause extraction</tspan><tspan x="688" dy="30">Claims and refund triage</tspan><tspan x="688" dy="30">Compliance summaries</tspan></text><rect x="150" y="355" width="500" height="215" rx="14" fill="#eef2f0" stroke="#cfd9d4" stroke-width="2"/><text x="178" y="403" font-size="27" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="178" dy="0">Probably not worth it</tspan></text><text x="178" y="445" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="178" dy="0">Rare internal notes</tspan><tspan x="178" dy="30">Anything a template solves</tspan><tspan x="178" dy="30">Low-volume busywork</tspan></text><rect x="660" y="355" width="500" height="215" rx="14" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><text x="688" y="403" font-size="27" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="688" dy="0">Automate</tspan></text><text x="688" y="445" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="688" dy="0">Support ticket tagging &amp; routing</tspan><tspan x="688" dy="30">Drafting replies for approval</tspan><tspan x="688" dy="30">Search and summaries over your docs</tspan></text><text x="655" y="626" font-size="21" font-weight="700" fill="#5b6b63" text-anchor="middle"><tspan x="655" dy="0">Task volume</tspan></text><text x="150" y="626" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="150" dy="0">Low</tspan></text><text x="1160" y="626" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="1160" dy="0">High</tspan></text><text x="60" y="350" font-size="21" font-weight="700" fill="#5b6b63" text-anchor="middle" transform="rotate(-90 60 350)"><tspan x="60" dy="0">Cost of a wrong answer</tspan></text><text x="122" y="160" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="122" dy="0">High</tspan></text><text x="122" y="564" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="122" dy="0">Low</tspan></text>
</svg>
