<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 507.2" width="1200" height="507.2" role="img" aria-label="Five-step process: constraints, shortlist, score, prototype, decide" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Five-step process: constraints, shortlist, score, prototype, decide</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="505.2" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">A five-step way to choose a stack</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Slow enough to be deliberate, fast enough to fit in a week</tspan></text><rect x="50" y="150" width="192.8" height="215.2" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="84" cy="186" r="16" fill="#176c4f"/><text x="84" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="84" dy="0">1</tspan></text><text x="72" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="72" dy="0">Constraints</tspan></text><text x="72" y="272" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="72" dy="0">Team skills,</tspan><tspan x="72" dy="24.3">budget,</tspan><tspan x="72" dy="24.3">deadline,</tspan><tspan x="72" dy="24.3">compliance.</tspan></text><line x1="246.8" y1="257.6" x2="272.8" y2="257.6" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="276.8" y="150" width="192.8" height="215.2" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="310.8" cy="186" r="16" fill="#176c4f"/><text x="310.8" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="310.8" dy="0">2</tspan></text><text x="298.8" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="298.8" dy="0">Shortlist</tspan></text><text x="298.8" y="272" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="298.8" dy="0">Two or three</tspan><tspan x="298.8" dy="24.3">realistic</tspan><tspan x="298.8" dy="24.3">options, not</tspan><tspan x="298.8" dy="24.3">ten.</tspan></text><line x1="473.6" y1="257.6" x2="499.6" y2="257.6" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="503.6" y="150" width="192.8" height="215.2" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="537.6" cy="186" r="16" fill="#176c4f"/><text x="537.6" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="537.6" dy="0">3</tspan></text><text x="525.6" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="525.6" dy="0">Score</tspan></text><text x="525.6" y="272" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="525.6" dy="0">Rate each</tspan><tspan x="525.6" dy="24.3">option against</tspan><tspan x="525.6" dy="24.3">weighted</tspan><tspan x="525.6" dy="24.3">criteria.</tspan></text><line x1="700.4000000000001" y1="257.6" x2="726.4000000000001" y2="257.6" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="730.4000000000001" y="150" width="192.8" height="215.2" rx="14" fill="#176c4f" stroke="#176c4f" stroke-width="2"/><circle cx="764.4000000000001" cy="186" r="16" fill="#e8a50c"/><text x="764.4000000000001" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="764.4000000000001" dy="0">4</tspan></text><text x="752.4000000000001" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="start"><tspan x="752.4000000000001" dy="0">Prototype</tspan></text><text x="752.4000000000001" y="272" font-size="18" font-weight="400" fill="#d4efe3" text-anchor="start"><tspan x="752.4000000000001" dy="0">Build the</tspan><tspan x="752.4000000000001" dy="24.3">riskiest part</tspan><tspan x="752.4000000000001" dy="24.3">first.</tspan></text><line x1="927.2" y1="257.6" x2="953.2" y2="257.6" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="957.2" y="150" width="192.8" height="215.2" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="991.2" cy="186" r="16" fill="#176c4f"/><text x="991.2" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="991.2" dy="0">5</tspan></text><text x="979.2" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="979.2" dy="0">Decide</tspan></text><text x="979.2" y="272" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="979.2" dy="0">Write down why,</tspan><tspan x="979.2" dy="24.3">so you can</tspan><tspan x="979.2" dy="24.3">revisit it.</tspan></text><rect x="50" y="405.2" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="441.2" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">A decision you can explain is much easier to change later than one you can't.</tspan></text>
</svg>
