<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 573.5" width="1200" height="573.5" role="img" aria-label="Two columns: use proven technology for databases, auth, payments and hosting; take risks only on the product's differentiator" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two columns: use proven technology for databases, auth, payments and hosting; take risks only on the product's differentiator</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="571.5" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Where to be boring, and where to take a risk</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Every unusual choice has a cost, so spend your risk where it pays</tspan></text><rect x="50" y="130" width="538" height="305.49999999999994" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="50" y="130" width="538" height="10" rx="5" fill="#176c4f" opacity="0.9"/><text x="74" y="182" font-size="25" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="74" dy="0">Be boring here</tspan></text><text x="74" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="74" dy="0">Proven, well-documented, easy to hire for</tspan></text><circle cx="80" cy="236.3" r="4" fill="#176c4f"/><text x="96" y="242" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Database</tspan></text><circle cx="80" cy="273" r="4" fill="#176c4f"/><text x="96" y="278.7" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Authentication</tspan></text><circle cx="80" cy="309.7" r="4" fill="#176c4f"/><text x="96" y="315.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Payments and billing</tspan></text><circle cx="80" cy="346.4" r="4" fill="#176c4f"/><text x="96" y="352.09999999999997" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Hosting and deployment</tspan></text><circle cx="80" cy="383.09999999999997" r="4" fill="#176c4f"/><text x="96" y="388.79999999999995" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Monitoring and logging</tspan></text><rect x="612" y="130" width="538" height="305.49999999999994" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="612" y="130" width="538" height="10" rx="5" fill="#ecd08a" opacity="0.9"/><text x="636" y="182" font-size="25" font-weight="800" fill="#9a6a00" text-anchor="start"><tspan x="636" dy="0">Take a calculated risk here</tspan></text><text x="636" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="636" dy="0">Only where it gives a real edge</tspan></text><circle cx="642" cy="236.3" r="4" fill="#ecd08a"/><text x="658" y="242" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">The core of what customers pay you for</tspan></text><circle cx="642" cy="273" r="4" fill="#ecd08a"/><text x="658" y="278.7" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">A capability a mainstream tool can't match</tspan></text><circle cx="642" cy="309.7" r="4" fill="#ecd08a"/><text x="658" y="315.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Anything a prototype has already proven</tspan></text><rect x="50" y="471.49999999999994" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="507.49999999999994" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Spend your innovation tokens on the product, not on the plumbing.</tspan></text>
</svg>
