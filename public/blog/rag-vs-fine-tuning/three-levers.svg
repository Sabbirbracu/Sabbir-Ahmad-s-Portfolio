<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 725.5999999999999" width="1200" height="725.5999999999999" role="img" aria-label="Comparison of better prompts, retrieval-augmented generation and fine-tuning: what each is best for and what to watch out for" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Comparison of better prompts, retrieval-augmented generation and fine-tuning: what each is best for and what to watch out for</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="723.5999999999999" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Three ways to adapt a model to your business</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">They solve different problems, so they are rarely interchangeable</tspan></text><rect x="50" y="130" width="350.6666666666667" height="457.59999999999997" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="50" y="130" width="350.6666666666667" height="10" rx="5" fill="#176c4f" opacity="0.9"/><text x="74" y="182" font-size="25" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="74" dy="0">Better prompts</tspan></text><text x="74" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="74" dy="0">Start here</tspan></text><text x="74" y="246" font-size="14" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="74" dy="0">BEST FOR</tspan></text><circle cx="80" cy="266.3" r="4" fill="#176c4f"/><text x="96" y="272" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Clear instructions and</tspan><tspan x="96" dy="24.7">examples</tspan></text><circle cx="80" cy="327.7" r="4" fill="#176c4f"/><text x="96" y="333.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Output format and tone</tspan></text><circle cx="80" cy="364.4" r="4" fill="#176c4f"/><text x="96" y="370.09999999999997" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Fast experiments</tspan></text><text x="74" y="420.79999999999995" font-size="14" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="74" dy="0">WATCH OUT</tspan></text><circle cx="80" cy="441.09999999999997" r="4" fill="#176c4f"/><text x="96" y="446.79999999999995" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Limited by the context</tspan><tspan x="96" dy="24.7">window</tspan></text><circle cx="80" cy="502.49999999999994" r="4" fill="#176c4f"/><text x="96" y="508.19999999999993" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Cannot add private knowledge</tspan><tspan x="96" dy="24.7">alone</tspan></text><rect x="424.6666666666667" y="130" width="350.6666666666667" height="457.59999999999997" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="424.6666666666667" y="130" width="350.6666666666667" height="10" rx="5" fill="#ecd08a" opacity="0.9"/><text x="448.6666666666667" y="182" font-size="25" font-weight="800" fill="#9a6a00" text-anchor="start"><tspan x="448.6666666666667" dy="0">RAG</tspan></text><text x="448.6666666666667" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="448.6666666666667" dy="0">Your knowledge</tspan></text><text x="448.6666666666667" y="246" font-size="14" font-weight="800" fill="#9a6a00" text-anchor="start"><tspan x="448.6666666666667" dy="0">BEST FOR</tspan></text><circle cx="454.6666666666667" cy="266.3" r="4" fill="#ecd08a"/><text x="470.6666666666667" y="272" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="470.6666666666667" dy="0">Your documents and data</tspan></text><circle cx="454.6666666666667" cy="303" r="4" fill="#ecd08a"/><text x="470.6666666666667" y="308.7" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="470.6666666666667" dy="0">Facts that change often</tspan></text><circle cx="454.6666666666667" cy="339.7" r="4" fill="#ecd08a"/><text x="470.6666666666667" y="345.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="470.6666666666667" dy="0">Answers with sources</tspan></text><text x="448.6666666666667" y="396.09999999999997" font-size="14" font-weight="800" fill="#9a6a00" text-anchor="start"><tspan x="448.6666666666667" dy="0">WATCH OUT</tspan></text><circle cx="454.6666666666667" cy="416.4" r="4" fill="#ecd08a"/><text x="470.6666666666667" y="422.09999999999997" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="470.6666666666667" dy="0">Retrieval quality is</tspan><tspan x="470.6666666666667" dy="24.7">everything</tspan></text><circle cx="454.6666666666667" cy="477.79999999999995" r="4" fill="#ecd08a"/><text x="470.6666666666667" y="483.49999999999994" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="470.6666666666667" dy="0">Must respect permissions</tspan></text><rect x="799.3333333333334" y="130" width="350.6666666666667" height="457.59999999999997" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="799.3333333333334" y="130" width="350.6666666666667" height="10" rx="5" fill="#cfd9d4" opacity="0.9"/><text x="823.3333333333334" y="182" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="823.3333333333334" dy="0">Fine-tuning</tspan></text><text x="823.3333333333334" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="823.3333333333334" dy="0">Behavior</tspan></text><text x="823.3333333333334" y="246" font-size="14" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="823.3333333333334" dy="0">BEST FOR</tspan></text><circle cx="829.3333333333334" cy="266.3" r="4" fill="#cfd9d4"/><text x="845.3333333333334" y="272" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="845.3333333333334" dy="0">Consistent style or format</tspan></text><circle cx="829.3333333333334" cy="303" r="4" fill="#cfd9d4"/><text x="845.3333333333334" y="308.7" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="845.3333333333334" dy="0">Narrow, repeated tasks</tspan></text><circle cx="829.3333333333334" cy="339.7" r="4" fill="#cfd9d4"/><text x="845.3333333333334" y="345.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="845.3333333333334" dy="0">Smaller, cheaper models</tspan></text><text x="823.3333333333334" y="396.09999999999997" font-size="14" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="823.3333333333334" dy="0">WATCH OUT</tspan></text><circle cx="829.3333333333334" cy="416.4" r="4" fill="#cfd9d4"/><text x="845.3333333333334" y="422.09999999999997" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="845.3333333333334" dy="0">Poor at teaching new facts</tspan></text><circle cx="829.3333333333334" cy="453.09999999999997" r="4" fill="#cfd9d4"/><text x="845.3333333333334" y="458.79999999999995" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="845.3333333333334" dy="0">Needs labeled data and</tspan><tspan x="845.3333333333334" dy="24.7">retraining</tspan></text><rect x="50" y="623.5999999999999" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="659.5999999999999" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Try them in this order: prompts, then RAG, then fine-tuning if a gap remains.</tspan></text>
</svg>
