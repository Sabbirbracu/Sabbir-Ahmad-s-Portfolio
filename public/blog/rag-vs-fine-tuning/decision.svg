<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Decision tree: use RAG when answers depend on changing private information, consider fine-tuning for style or narrow behavior, otherwise better prompts" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Decision tree: use RAG when answers depend on changing private information, consider fine-tuning for style or narrow behavior, otherwise better prompts</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="638" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Which approach fits your problem?</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Two questions cover most cases</tspan></text><rect x="60" y="140" width="470" height="100" rx="12" fill="#ffffff" stroke="#17211c" stroke-width="2.5"/><text x="295" y="182" font-size="21" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="295" dy="0">Does the answer depend on your own,</tspan><tspan x="295" dy="27.3">changing information?</tspan></text><line x1="534" y1="190" x2="656" y2="190" stroke="#176c4f" stroke-width="3" marker-end="url(#arrg)"/><text x="595" y="176" font-size="19" font-weight="700" fill="#5b6b63" text-anchor="middle"><tspan x="595" dy="0">Yes</tspan></text><rect x="660" y="130" width="480" height="120" rx="12" fill="#fdf3d8" stroke="#ecd08a" stroke-width="3"/><text x="900" y="172" font-size="24" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="900" dy="0">Use RAG</tspan></text><text x="900" y="206" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="900" dy="0">Retrieve the right passages and</tspan><tspan x="900" dy="23.400000000000002">cite them. Keep the data fresh.</tspan></text><line x1="295" y1="244" x2="295" y2="326" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><text x="311" y="292" font-size="19" font-weight="700" fill="#5b6b63" text-anchor="start"><tspan x="311" dy="0">No</tspan></text><rect x="60" y="330" width="470" height="100" rx="12" fill="#ffffff" stroke="#17211c" stroke-width="2.5"/><text x="295" y="372" font-size="21" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="295" dy="0">Do you need a consistent style,</tspan><tspan x="295" dy="27.3">format, or narrow behavior?</tspan></text><line x1="534" y1="380" x2="656" y2="380" stroke="#176c4f" stroke-width="3" marker-end="url(#arrg)"/><text x="595" y="366" font-size="19" font-weight="700" fill="#5b6b63" text-anchor="middle"><tspan x="595" dy="0">Yes</tspan></text><rect x="660" y="320" width="480" height="120" rx="12" fill="#e3f1ea" stroke="#176c4f" stroke-width="3"/><text x="900" y="362" font-size="24" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="900" dy="0">Consider fine-tuning</tspan></text><text x="900" y="396" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="900" dy="0">After prompts and examples fall short.</tspan><tspan x="900" dy="23.400000000000002">Needs good labeled data.</tspan></text><line x1="295" y1="434" x2="295" y2="496" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><text x="311" y="470" font-size="19" font-weight="700" fill="#5b6b63" text-anchor="start"><tspan x="311" dy="0">No</tspan></text><rect x="60" y="500" width="470" height="100" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="3"/><text x="295" y="542" font-size="24" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="295" dy="0">Better prompts may be enough</tspan></text><text x="295" y="576" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="295" dy="0">Clear instructions and a few examples.</tspan></text><rect x="660" y="500" width="480" height="100" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="900" y="542" font-size="19" font-weight="700" fill="#8fd1b6" text-anchor="middle"><tspan x="900" dy="0">Often the best answer is both:</tspan></text><text x="900" y="574" font-size="21" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="900" dy="0">RAG for knowledge, tuning for behavior</tspan></text>
</svg>
