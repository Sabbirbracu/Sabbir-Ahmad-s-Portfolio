<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 542.4000000000001" width="1200" height="542.4000000000001" role="img" aria-label="Four common causes of slow online stores: images, apps and plugins, theme code, and hosting and caching" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Four common causes of slow online stores: images, apps and plugins, theme code, and hosting and caching</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="540.4000000000001" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Where a slow store loses its speed</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">The same four culprits show up on almost every audit</tspan></text><rect x="50" y="130" width="257" height="274.40000000000003" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="50" y="130" width="257" height="10" rx="5" fill="#176c4f" opacity="0.9"/><text x="74" y="182" font-size="22" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="74" dy="0">Images</tspan></text><circle cx="80" cy="212.6" r="4" fill="#176c4f"/><text x="96" y="218" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Oversized originals</tspan></text><circle cx="80" cy="248" r="4" fill="#176c4f"/><text x="96" y="253.4" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">No modern formats</tspan></text><circle cx="80" cy="283.40000000000003" r="4" fill="#176c4f"/><text x="96" y="288.8" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Everything loads at</tspan><tspan x="96" dy="23.400000000000002">once</tspan></text><rect x="331" y="130" width="257" height="274.40000000000003" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="331" y="130" width="257" height="10" rx="5" fill="#ecd08a" opacity="0.9"/><text x="355" y="182" font-size="22" font-weight="800" fill="#9a6a00" text-anchor="start"><tspan x="355" dy="0">Apps and plugins</tspan></text><circle cx="361" cy="212.6" r="4" fill="#ecd08a"/><text x="377" y="218" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Each adds scripts</tspan><tspan x="377" dy="23.400000000000002">and styles</tspan></text><circle cx="361" cy="271.40000000000003" r="4" fill="#ecd08a"/><text x="377" y="276.8" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Many run on every</tspan><tspan x="377" dy="23.400000000000002">page</tspan></text><circle cx="361" cy="330.20000000000005" r="4" fill="#ecd08a"/><text x="377" y="335.6" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Leftovers from</tspan><tspan x="377" dy="23.400000000000002">removed ones</tspan></text><rect x="612" y="130" width="257" height="274.40000000000003" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="612" y="130" width="257" height="10" rx="5" fill="#cfd9d4" opacity="0.9"/><text x="636" y="182" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="636" dy="0">Theme and code</tspan></text><circle cx="642" cy="212.6" r="4" fill="#cfd9d4"/><text x="658" y="218" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Heavy sliders and</tspan><tspan x="658" dy="23.400000000000002">animations</tspan></text><circle cx="642" cy="271.40000000000003" r="4" fill="#cfd9d4"/><text x="658" y="276.8" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Unused CSS and</tspan><tspan x="658" dy="23.400000000000002">JavaScript</tspan></text><circle cx="642" cy="330.20000000000005" r="4" fill="#cfd9d4"/><text x="658" y="335.6" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Too many font files</tspan></text><rect x="893" y="130" width="257" height="274.40000000000003" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="893" y="130" width="257" height="10" rx="5" fill="#e7b9af" opacity="0.9"/><text x="917" y="182" font-size="22" font-weight="800" fill="#c2412d" text-anchor="start"><tspan x="917" dy="0">Server and cache</tspan></text><circle cx="923" cy="212.6" r="4" fill="#e7b9af"/><text x="939" y="218" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">Slow server response</tspan></text><circle cx="923" cy="248" r="4" fill="#e7b9af"/><text x="939" y="253.4" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">No page or object</tspan><tspan x="939" dy="23.400000000000002">cache</tspan></text><circle cx="923" cy="306.8" r="4" fill="#e7b9af"/><text x="939" y="312.2" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">No CDN for assets</tspan></text><rect x="50" y="440.40000000000003" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="476.40000000000003" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Work in this order: images, apps and plugins, theme code, then server and cache.</tspan></text>
</svg>
