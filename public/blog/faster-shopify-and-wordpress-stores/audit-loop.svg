<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 626" width="1200" height="626" role="img" aria-label="Speed audit loop: measure, remove, optimize and verify" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Speed audit loop: measure, remove, optimize and verify</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="624" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">A repeatable speed audit</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Measure, remove, optimize, verify, and keep it that way</tspan></text><rect x="110" y="140" width="440" height="140" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="144" cy="178" r="16" fill="#176c4f"/><text x="144" y="185" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="144" dy="0">1</tspan></text><text x="176" y="186" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="176" dy="0">Measure</tspan></text><text x="138" y="232" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="138" dy="0">Run PageSpeed Insights on home,</tspan><tspan x="138" dy="27">collection, and product pages</tspan></text><rect x="650" y="140" width="440" height="140" rx="12" fill="#176c4f" stroke="#176c4f" stroke-width="2"/><circle cx="684" cy="178" r="16" fill="#e8a50c"/><text x="684" y="185" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="684" dy="0">2</tspan></text><text x="716" y="186" font-size="25" font-weight="800" fill="#fff" text-anchor="start"><tspan x="716" dy="0">Remove</tspan></text><text x="678" y="232" font-size="20" font-weight="400" fill="#d4efe3" text-anchor="start"><tspan x="678" dy="0">Uninstall unused apps and plugins,</tspan><tspan x="678" dy="27">and delete their leftovers</tspan></text><rect x="650" y="344" width="440" height="140" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="684" cy="382" r="16" fill="#176c4f"/><text x="684" y="389" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="684" dy="0">3</tspan></text><text x="716" y="390" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="716" dy="0">Optimize</tspan></text><text x="678" y="436" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="678" dy="0">Resize images, defer scripts, and</tspan><tspan x="678" dy="27">turn on caching</tspan></text><rect x="110" y="344" width="440" height="140" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="144" cy="382" r="16" fill="#176c4f"/><text x="144" y="389" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="144" dy="0">4</tspan></text><text x="176" y="390" font-size="25" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="176" dy="0">Verify</tspan></text><text x="138" y="436" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="138" dy="0">Re-test and compare against your</tspan><tspan x="138" dy="27">baseline</tspan></text><line x1="554" y1="210" x2="646" y2="210" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><line x1="870" y1="284" x2="870" y2="340" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><line x1="646" y1="414" x2="554" y2="414" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><line x1="330" y1="340" x2="330" y2="284" stroke="#176c4f" stroke-width="4" marker-end="url(#arrg)"/><rect x="50" y="524" width="1100" height="66" rx="12" fill="#e3f1ea" stroke="#e3f1ea" stroke-width="2"/><text x="600" y="560" font-size="21" font-weight="600" fill="#17211c" text-anchor="middle"><tspan x="600" dy="0">Change one thing at a time, so you know what actually helped.</tspan></text>
</svg>
