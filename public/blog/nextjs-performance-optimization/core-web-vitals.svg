<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Core Web Vitals thresholds for LCP, INP and CLS, showing good, needs improvement and poor ranges" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Core Web Vitals thresholds for LCP, INP and CLS, showing good, needs improvement and poor ranges</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="648" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Core Web Vitals: the three numbers that matter</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Judged at the 75th percentile of real visits</tspan></text><rect x="50" y="129" width="1100" height="132" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="78" y="181" font-size="38" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="78" dy="0">LCP</tspan></text><text x="78" y="215" font-size="19" font-weight="700" fill="#17211c" text-anchor="start"><tspan x="78" dy="0">Largest Contentful Paint</tspan></text><text x="78" y="241" font-size="17" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="78" dy="0">How fast the main content appears</tspan></text><rect x="440" y="155" width="315" height="30" fill="#47b48c" rx="6"/><rect x="755" y="155" width="210" height="30" fill="#e8a50c"/><rect x="965" y="155" width="175" height="30" fill="#c2412d" rx="6"/><rect x="720" y="155" width="70" height="30" fill="#e8a50c"/><rect x="930" y="155" width="70" height="30" fill="#c2412d"/><text x="597.5" y="213" font-size="19" font-weight="700" fill="#176c4f" text-anchor="middle"><tspan x="597.5" dy="0">Good</tspan><tspan x="597.5" dy="23.75">up to 2.5 s</tspan></text><text x="860" y="213" font-size="19" font-weight="700" fill="#9a6a00" text-anchor="middle"><tspan x="860" dy="0">Needs improvement</tspan><tspan x="860" dy="23.75">up to 4 s</tspan></text><text x="1052.5" y="213" font-size="19" font-weight="700" fill="#c2412d" text-anchor="middle"><tspan x="1052.5" dy="0">Poor</tspan><tspan x="1052.5" dy="23.75">over 4 s</tspan></text><rect x="50" y="279" width="1100" height="132" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="78" y="331" font-size="38" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="78" dy="0">INP</tspan></text><text x="78" y="365" font-size="19" font-weight="700" fill="#17211c" text-anchor="start"><tspan x="78" dy="0">Interaction to Next Paint</tspan></text><text x="78" y="391" font-size="17" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="78" dy="0">How quickly the page responds to input</tspan></text><rect x="440" y="305" width="315" height="30" fill="#47b48c" rx="6"/><rect x="755" y="305" width="210" height="30" fill="#e8a50c"/><rect x="965" y="305" width="175" height="30" fill="#c2412d" rx="6"/><rect x="720" y="305" width="70" height="30" fill="#e8a50c"/><rect x="930" y="305" width="70" height="30" fill="#c2412d"/><text x="597.5" y="363" font-size="19" font-weight="700" fill="#176c4f" text-anchor="middle"><tspan x="597.5" dy="0">Good</tspan><tspan x="597.5" dy="23.75">up to 200 ms</tspan></text><text x="860" y="363" font-size="19" font-weight="700" fill="#9a6a00" text-anchor="middle"><tspan x="860" dy="0">Needs improvement</tspan><tspan x="860" dy="23.75">up to 500 ms</tspan></text><text x="1052.5" y="363" font-size="19" font-weight="700" fill="#c2412d" text-anchor="middle"><tspan x="1052.5" dy="0">Poor</tspan><tspan x="1052.5" dy="23.75">over 500 ms</tspan></text><rect x="50" y="429" width="1100" height="132" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="78" y="481" font-size="38" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="78" dy="0">CLS</tspan></text><text x="78" y="515" font-size="19" font-weight="700" fill="#17211c" text-anchor="start"><tspan x="78" dy="0">Cumulative Layout Shift</tspan></text><text x="78" y="541" font-size="17" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="78" dy="0">How much the layout jumps around</tspan></text><rect x="440" y="455" width="315" height="30" fill="#47b48c" rx="6"/><rect x="755" y="455" width="210" height="30" fill="#e8a50c"/><rect x="965" y="455" width="175" height="30" fill="#c2412d" rx="6"/><rect x="720" y="455" width="70" height="30" fill="#e8a50c"/><rect x="930" y="455" width="70" height="30" fill="#c2412d"/><text x="597.5" y="513" font-size="19" font-weight="700" fill="#176c4f" text-anchor="middle"><tspan x="597.5" dy="0">Good</tspan><tspan x="597.5" dy="23.75">up to 0.1</tspan></text><text x="860" y="513" font-size="19" font-weight="700" fill="#9a6a00" text-anchor="middle"><tspan x="860" dy="0">Needs improvement</tspan><tspan x="860" dy="23.75">up to 0.25</tspan></text><text x="1052.5" y="513" font-size="19" font-weight="700" fill="#c2412d" text-anchor="middle"><tspan x="1052.5" dy="0">Poor</tspan><tspan x="1052.5" dy="23.75">over 0.25</tspan></text><text x="600" y="622" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="600" dy="0">Thresholds as published by Google's web.dev. Lab tools estimate them; field data decides.</tspan></text>
</svg>
