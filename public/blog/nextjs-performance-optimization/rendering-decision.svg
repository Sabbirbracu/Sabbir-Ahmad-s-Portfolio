<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Decision tree for choosing between static, revalidated and dynamic rendering in Next.js" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Decision tree for choosing between static, revalidated and dynamic rendering in Next.js</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="608" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Choosing how to render a page</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Start static, and add dynamism only where the content demands it</tspan></text><rect x="60" y="140" width="380" height="84" rx="12" fill="#ffffff" stroke="#17211c" stroke-width="2.5"/><text x="250" y="190" font-size="21" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="250" dy="0">Does it depend on the request?</tspan></text><rect x="60" y="330" width="380" height="84" rx="12" fill="#ffffff" stroke="#17211c" stroke-width="2.5"/><text x="250" y="380" font-size="21" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="250" dy="0">Does it change after deploy?</tspan></text><line x1="250" y1="226" x2="250" y2="326" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><text x="266" y="282" font-size="19" font-weight="700" fill="#5b6b63" text-anchor="start"><tspan x="266" dy="0">No</tspan></text><line x1="444" y1="182" x2="556" y2="182" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><text x="500" y="168" font-size="19" font-weight="700" fill="#5b6b63" text-anchor="middle"><tspan x="500" dy="0">Yes</tspan></text><rect x="560" y="120" width="580" height="110" rx="12" fill="#fdf3d8" stroke="#ecd08a" stroke-width="3"/><text x="850" y="164" font-size="24" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="850" dy="0">Dynamic render + streaming</tspan></text><text x="850" y="198" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="850" dy="0">Wrap slow parts in Suspense so the shell appears instantly</tspan></text><line x1="250" y1="416" x2="250" y2="456" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><text x="266" y="442" font-size="19" font-weight="700" fill="#5b6b63" text-anchor="start"><tspan x="266" dy="0">No</tspan></text><rect x="60" y="460" width="380" height="110" rx="12" fill="#e3f1ea" stroke="#176c4f" stroke-width="3"/><text x="250" y="504" font-size="24" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="250" dy="0">Static (prerendered)</tspan></text><text x="250" y="538" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="250" dy="0">Fastest. Served from the CDN</tspan></text><line x1="444" y1="372" x2="556" y2="372" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><text x="500" y="358" font-size="19" font-weight="700" fill="#5b6b63" text-anchor="middle"><tspan x="500" dy="0">Yes</tspan></text><rect x="560" y="320" width="580" height="110" rx="12" fill="#e3f1ea" stroke="#176c4f" stroke-width="3"/><text x="850" y="364" font-size="24" font-weight="800" fill="#17211c" text-anchor="middle"><tspan x="850" dy="0">Revalidate (ISR)</tspan></text><text x="850" y="398" font-size="18" font-weight="400" fill="#5b6b63" text-anchor="middle"><tspan x="850" dy="0">Prerender, then refresh on a timer or by tag</tspan></text><rect x="560" y="470" width="580" height="100" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="850" y="512" font-size="19" font-weight="700" fill="#8fd1b6" text-anchor="middle"><tspan x="850" dy="0">Then, inside any page:</tspan></text><text x="850" y="545" font-size="21" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="850" dy="0">only interactive leaves become Client Components</tspan></text>
</svg>
