<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Timeline comparing three sequential data fetches against the same fetches run in parallel" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Timeline comparing three sequential data fetches against the same fetches run in parallel</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="638" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Sequential awaits vs. parallel requests</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Illustrative timings: independent fetches should not wait for each other</tspan></text><rect x="50" y="130" width="1100" height="230" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="78" y="172" font-size="24" font-weight="800" fill="#c2412d" text-anchor="start"><tspan x="78" dy="0">Sequential: await, await, await</tspan></text><text x="310" y="222" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="310" dy="0">user</tspan></text><rect x="330" y="198" width="186" height="34" rx="8" fill="#c2412d" stroke="none" stroke-width="0"/><text x="423" y="222" font-size="18" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="423" dy="0">300 ms</tspan></text><text x="310" y="270" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="310" dy="0">orders</tspan></text><rect x="516" y="246" width="248" height="34" rx="8" fill="#c2412d" stroke="none" stroke-width="0"/><text x="640" y="270" font-size="18" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="640" dy="0">400 ms</tspan></text><text x="310" y="318" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="310" dy="0">recommendations</tspan></text><rect x="764" y="294" width="186" height="34" rx="8" fill="#c2412d" stroke="none" stroke-width="0"/><text x="857" y="318" font-size="18" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="857" dy="0">300 ms</tspan></text><line x1="950" y1="186" x2="950" y2="344" stroke="#17211c" stroke-width="2.5" stroke-dasharray="6 5"/><text x="964" y="335" font-size="20" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="964" dy="0">~1000 ms total</tspan></text><rect x="50" y="380" width="1100" height="230" rx="12" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="78" y="422" font-size="24" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="78" dy="0">Parallel: Promise.all</tspan></text><text x="310" y="472" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="310" dy="0">user</tspan></text><rect x="330" y="448" width="186" height="34" rx="8" fill="#176c4f" stroke="none" stroke-width="0"/><text x="423" y="472" font-size="18" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="423" dy="0">300 ms</tspan></text><text x="310" y="520" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="310" dy="0">orders</tspan></text><rect x="330" y="496" width="248" height="34" rx="8" fill="#176c4f" stroke="none" stroke-width="0"/><text x="454" y="520" font-size="18" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="454" dy="0">400 ms</tspan></text><text x="310" y="568" font-size="20" font-weight="400" fill="#5b6b63" text-anchor="end"><tspan x="310" dy="0">recommendations</tspan></text><rect x="330" y="544" width="186" height="34" rx="8" fill="#176c4f" stroke="none" stroke-width="0"/><text x="423" y="568" font-size="18" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="423" dy="0">300 ms</tspan></text><line x1="578" y1="436" x2="578" y2="594" stroke="#17211c" stroke-width="2.5" stroke-dasharray="6 5"/><text x="592" y="585" font-size="20" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="592" dy="0">~400 ms total</tspan></text>
</svg>
