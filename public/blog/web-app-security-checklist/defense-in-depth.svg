<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512.6" width="1200" height="512.6" role="img" aria-label="Four security layers: edge, application, data and operations" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Four security layers: edge, application, data and operations</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="510.6" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Defense in depth</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Each layer assumes another one may fail</tspan></text><rect x="50" y="150" width="242" height="220.60000000000002" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="84" cy="186" r="16" fill="#176c4f"/><text x="84" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="84" dy="0">1</tspan></text><text x="72" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="72" dy="0">Edge</tspan></text><text x="72" y="272" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="72" dy="0">HTTPS, a CDN or</tspan><tspan x="72" dy="25.650000000000002">WAF, and DDoS</tspan><tspan x="72" dy="25.650000000000002">protection.</tspan></text><line x1="296" y1="260.3" x2="332" y2="260.3" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="336" y="150" width="242" height="220.60000000000002" rx="14" fill="#176c4f" stroke="#176c4f" stroke-width="2"/><circle cx="370" cy="186" r="16" fill="#e8a50c"/><text x="370" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="370" dy="0">2</tspan></text><text x="358" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="start"><tspan x="358" dy="0">Application</tspan></text><text x="358" y="272" font-size="19" font-weight="400" fill="#d4efe3" text-anchor="start"><tspan x="358" dy="0">Authentication,</tspan><tspan x="358" dy="25.650000000000002">authorization,</tspan><tspan x="358" dy="25.650000000000002">validation, safe</tspan><tspan x="358" dy="25.650000000000002">errors.</tspan></text><line x1="582" y1="260.3" x2="618" y2="260.3" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="622" y="150" width="242" height="220.60000000000002" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="656" cy="186" r="16" fill="#176c4f"/><text x="656" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="656" dy="0">3</tspan></text><text x="644" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="644" dy="0">Data</tspan></text><text x="644" y="272" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="644" dy="0">Least-privilege</tspan><tspan x="644" dy="25.650000000000002">access, encryption,</tspan><tspan x="644" dy="25.650000000000002">and backups.</tspan></text><line x1="868" y1="260.3" x2="904" y2="260.3" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="908" y="150" width="242" height="220.60000000000002" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="942" cy="186" r="16" fill="#176c4f"/><text x="942" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="942" dy="0">4</tspan></text><text x="930" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="930" dy="0">Operations</tspan></text><text x="930" y="272" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="930" dy="0">Logging, alerts,</tspan><tspan x="930" dy="25.650000000000002">patching, and an</tspan><tspan x="930" dy="25.650000000000002">incident plan.</tspan></text><rect x="50" y="410.6" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="446.6" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">No single control is enough on its own. Layers turn one mistake into a non-event.</tspan></text>
</svg>
