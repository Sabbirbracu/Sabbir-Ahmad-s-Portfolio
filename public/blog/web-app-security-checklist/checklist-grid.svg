<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 742.3" width="1200" height="742.3" role="img" aria-label="Six-part security checklist: identity, access control, input and output, secrets, dependencies and monitoring" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Six-part security checklist: identity, access control, input and output, secrets, dependencies and monitoring</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="740.3" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">A practical security checklist</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Six areas that cover most real-world incidents</tspan></text><rect x="50" y="130" width="350.6666666666667" height="237.5" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="74" y="172" font-size="23" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="74" dy="0">Identity</tspan></text><circle cx="84" cy="202" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M78.5,202 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="208" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="106" dy="0">Hash passwords with bcrypt</tspan><tspan x="106" dy="24.7">or Argon2</tspan></text><circle cx="84" cy="263.4" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M78.5,263.4 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="269.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="106" dy="0">Require MFA for admin</tspan><tspan x="106" dy="24.7">accounts</tspan></text><circle cx="84" cy="324.79999999999995" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M78.5,324.79999999999995 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="330.79999999999995" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="106" dy="0">Rate-limit login attempts</tspan></text><rect x="424.6666666666667" y="130" width="350.6666666666667" height="237.5" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="448.6666666666667" y="172" font-size="23" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="448.6666666666667" dy="0">Access control</tspan></text><circle cx="458.6666666666667" cy="202" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M453.1666666666667,202 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="480.6666666666667" y="208" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="480.6666666666667" dy="0">Check ownership on every</tspan><tspan x="480.6666666666667" dy="24.7">request</tspan></text><circle cx="458.6666666666667" cy="263.4" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M453.1666666666667,263.4 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="480.6666666666667" y="269.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="480.6666666666667" dy="0">Deny by default</tspan></text><circle cx="458.6666666666667" cy="300.09999999999997" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M453.1666666666667,300.09999999999997 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="480.6666666666667" y="306.09999999999997" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="480.6666666666667" dy="0">Scope every query by</tspan><tspan x="480.6666666666667" dy="24.7">tenant</tspan></text><rect x="799.3333333333334" y="130" width="350.6666666666667" height="237.5" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="823.3333333333334" y="172" font-size="23" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="823.3333333333334" dy="0">Input and output</tspan></text><circle cx="833.3333333333334" cy="202" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M827.8333333333334,202 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="855.3333333333334" y="208" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="855.3333333333334" dy="0">Validate on the server</tspan></text><circle cx="833.3333333333334" cy="238.7" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M827.8333333333334,238.7 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="855.3333333333334" y="244.7" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="855.3333333333334" dy="0">Use parameterized queries</tspan></text><circle cx="833.3333333333334" cy="275.4" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M827.8333333333334,275.4 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="855.3333333333334" y="281.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="855.3333333333334" dy="0">Encode output</tspan></text><rect x="50" y="391.5" width="350.6666666666667" height="212.8" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="74" y="433.5" font-size="23" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="74" dy="0">Secrets and config</tspan></text><circle cx="84" cy="463.5" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M78.5,463.5 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="469.5" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="106" dy="0">Keep secrets out of Git</tspan></text><circle cx="84" cy="500.2" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M78.5,500.2 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="506.2" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="106" dy="0">Rotate keys on a schedule</tspan></text><circle cx="84" cy="536.9" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M78.5,536.9 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="542.9" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="106" dy="0">Separate dev and</tspan><tspan x="106" dy="24.7">production</tspan></text><rect x="424.6666666666667" y="391.5" width="350.6666666666667" height="212.8" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="448.6666666666667" y="433.5" font-size="23" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="448.6666666666667" dy="0">Dependencies</tspan></text><circle cx="458.6666666666667" cy="463.5" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M453.1666666666667,463.5 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="480.6666666666667" y="469.5" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="480.6666666666667" dy="0">Audit and update regularly</tspan></text><circle cx="458.6666666666667" cy="500.2" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M453.1666666666667,500.2 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="480.6666666666667" y="506.2" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="480.6666666666667" dy="0">Review new packages</tspan></text><circle cx="458.6666666666667" cy="536.9" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M453.1666666666667,536.9 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="480.6666666666667" y="542.9" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="480.6666666666667" dy="0">Remove what you don't use</tspan></text><rect x="799.3333333333334" y="391.5" width="350.6666666666667" height="212.8" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="823.3333333333334" y="433.5" font-size="23" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="823.3333333333334" dy="0">Monitoring</tspan></text><circle cx="833.3333333333334" cy="463.5" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M827.8333333333334,463.5 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="855.3333333333334" y="469.5" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="855.3333333333334" dy="0">Log sign-ins and failures</tspan></text><circle cx="833.3333333333334" cy="500.2" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M827.8333333333334,500.2 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="855.3333333333334" y="506.2" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="855.3333333333334" dy="0">Alert on unusual activity</tspan></text><circle cx="833.3333333333334" cy="536.9" r="11" fill="#e3f1ea" stroke="#176c4f" stroke-width="2"/><path d="M827.8333333333334,536.9 l4,4 l7,-8" fill="none" stroke="#176c4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="855.3333333333334" y="542.9" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="855.3333333333334" dy="0">Test your backup restores</tspan></text><rect x="50" y="640.3" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="676.3" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Broken access control sits at the top of the OWASP list. Start there.</tspan></text>
</svg>
