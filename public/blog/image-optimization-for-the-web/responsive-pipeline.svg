<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486.95" width="1200" height="486.95" role="img" aria-label="Responsive image pipeline: master image, resize, describe with srcset and sizes, deliver from a CDN" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Responsive image pipeline: master image, resize, describe with srcset and sizes, deliver from a CDN</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="484.95" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">From one master image to the right file for every screen</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Do the work once at build time, and let the browser choose</tspan></text><rect x="50" y="150" width="242" height="194.95" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="84" cy="186" r="16" fill="#176c4f"/><text x="84" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="84" dy="0">1</tspan></text><text x="72" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="72" dy="0">Master image</tspan></text><text x="72" y="272" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="72" dy="0">Keep one</tspan><tspan x="72" dy="25.650000000000002">high-quality</tspan><tspan x="72" dy="25.650000000000002">original.</tspan></text><line x1="296" y1="247.475" x2="332" y2="247.475" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="336" y="150" width="242" height="194.95" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="370" cy="186" r="16" fill="#176c4f"/><text x="370" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="370" dy="0">2</tspan></text><text x="358" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="358" dy="0">Resize</tspan></text><text x="358" y="272" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="358" dy="0">Generate several</tspan><tspan x="358" dy="25.650000000000002">widths from it.</tspan></text><line x1="582" y1="247.475" x2="618" y2="247.475" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="622" y="150" width="242" height="194.95" rx="14" fill="#176c4f" stroke="#176c4f" stroke-width="2"/><circle cx="656" cy="186" r="16" fill="#e8a50c"/><text x="656" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="656" dy="0">3</tspan></text><text x="644" y="238" font-size="22" font-weight="800" fill="#fff" text-anchor="start"><tspan x="644" dy="0">Describe</tspan></text><text x="644" y="272" font-size="19" font-weight="400" fill="#d4efe3" text-anchor="start"><tspan x="644" dy="0">Add srcset and</tspan><tspan x="644" dy="25.650000000000002">sizes so the</tspan><tspan x="644" dy="25.650000000000002">browser can choose.</tspan></text><line x1="868" y1="247.475" x2="904" y2="247.475" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="908" y="150" width="242" height="194.95" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="942" cy="186" r="16" fill="#176c4f"/><text x="942" y="193" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="942" dy="0">4</tspan></text><text x="930" y="238" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="930" dy="0">Deliver</tspan></text><text x="930" y="272" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="930" dy="0">Serve from a CDN</tspan><tspan x="930" dy="25.650000000000002">with long-lived</tspan><tspan x="930" dy="25.650000000000002">caching.</tspan></text><rect x="50" y="384.95" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="420.95" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">The browser picks the smallest file that still looks sharp on the visitor's screen.</tspan></text>
</svg>
