<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566.4000000000001" width="1200" height="566.4000000000001" role="img" aria-label="Image formats compared: JPEG and PNG, WebP, AVIF and SVG, with what each is best for" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Image formats compared: JPEG and PNG, WebP, AVIF and SVG, with what each is best for</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="564.4000000000001" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Choosing an image format</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Pick by content type, then serve the smallest format the browser supports</tspan></text><rect x="50" y="130" width="257" height="298.40000000000003" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="50" y="130" width="257" height="10" rx="5" fill="#cfd9d4" opacity="0.9"/><text x="74" y="182" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="74" dy="0">JPEG / PNG</tspan></text><text x="74" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="74" dy="0">Universal fallbacks</tspan></text><circle cx="80" cy="236.6" r="4" fill="#cfd9d4"/><text x="96" y="242" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">JPEG for photos</tspan></text><circle cx="80" cy="272" r="4" fill="#cfd9d4"/><text x="96" y="277.4" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">PNG for sharp</tspan><tspan x="96" dy="23.400000000000002">graphics and</tspan><tspan x="96" dy="23.400000000000002">transparency</tspan></text><circle cx="80" cy="354.2" r="4" fill="#cfd9d4"/><text x="96" y="359.59999999999997" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Bigger files than</tspan><tspan x="96" dy="23.400000000000002">newer formats</tspan></text><rect x="331" y="130" width="257" height="298.40000000000003" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="331" y="130" width="257" height="10" rx="5" fill="#176c4f" opacity="0.9"/><text x="355" y="182" font-size="22" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="355" dy="0">WebP</tspan></text><text x="355" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="355" dy="0">A solid default</tspan></text><circle cx="361" cy="236.6" r="4" fill="#176c4f"/><text x="377" y="242" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Photos and graphics</tspan></text><circle cx="361" cy="272" r="4" fill="#176c4f"/><text x="377" y="277.4" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Transparency and</tspan><tspan x="377" dy="23.400000000000002">animation</tspan></text><circle cx="361" cy="330.8" r="4" fill="#176c4f"/><text x="377" y="336.2" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Works in all current</tspan><tspan x="377" dy="23.400000000000002">major browsers</tspan></text><rect x="612" y="130" width="257" height="298.40000000000003" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="612" y="130" width="257" height="10" rx="5" fill="#ecd08a" opacity="0.9"/><text x="636" y="182" font-size="22" font-weight="800" fill="#9a6a00" text-anchor="start"><tspan x="636" dy="0">AVIF</tspan></text><text x="636" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="636" dy="0">Often the smallest</tspan></text><circle cx="642" cy="236.6" r="4" fill="#ecd08a"/><text x="658" y="242" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Great for photos</tspan></text><circle cx="642" cy="272" r="4" fill="#ecd08a"/><text x="658" y="277.4" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Slower to encode</tspan></text><circle cx="642" cy="307.4" r="4" fill="#ecd08a"/><text x="658" y="312.79999999999995" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Broad support; keep</tspan><tspan x="658" dy="23.400000000000002">a fallback</tspan></text><rect x="893" y="130" width="257" height="298.40000000000003" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="893" y="130" width="257" height="10" rx="5" fill="#176c4f" opacity="0.9"/><text x="917" y="182" font-size="22" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="917" dy="0">SVG</tspan></text><text x="917" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="917" dy="0">Vector artwork</tspan></text><circle cx="923" cy="236.6" r="4" fill="#176c4f"/><text x="939" y="242" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">Logos, icons,</tspan><tspan x="939" dy="23.400000000000002">illustrations</tspan></text><circle cx="923" cy="295.40000000000003" r="4" fill="#176c4f"/><text x="939" y="300.8" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">Sharp at any size</tspan></text><circle cx="923" cy="330.80000000000007" r="4" fill="#176c4f"/><text x="939" y="336.20000000000005" font-size="18" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">Sanitize anything</tspan><tspan x="939" dy="23.400000000000002">users upload</tspan></text><rect x="50" y="464.40000000000003" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="500.40000000000003" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Serve AVIF or WebP with a JPEG or PNG fallback, using the picture element.</tspan></text>
</svg>
