<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528.95" width="1200" height="528.95" role="img" aria-label="Spectrum from fixed workflows to AI inside workflows, single agents, and multi-agent systems" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Spectrum from fixed workflows to AI inside workflows, single agents, and multi-agent systems</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="526.95" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">How much autonomy do you need?</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Most business problems are solved well to the left of this diagram</tspan></text><text x="600" y="150" font-size="20" font-weight="700" fill="#5b6b63" text-anchor="middle"><tspan x="600" dy="0">More flexibility also means more cost, more latency, and more risk</tspan></text><line x1="50" y1="168" x2="1150" y2="168" stroke="#cfd9d4" stroke-width="2"/><rect x="50" y="192" width="242" height="194.95" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="84" cy="228" r="16" fill="#176c4f"/><text x="84" y="235" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="84" dy="0">1</tspan></text><text x="72" y="280" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="72" dy="0">Fixed workflow</tspan></text><text x="72" y="314" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="72" dy="0">Code decides every</tspan><tspan x="72" dy="25.650000000000002">step. Predictable</tspan><tspan x="72" dy="25.650000000000002">and cheap.</tspan></text><line x1="296" y1="289.475" x2="332" y2="289.475" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="336" y="192" width="242" height="194.95" rx="14" fill="#176c4f" stroke="#176c4f" stroke-width="2"/><circle cx="370" cy="228" r="16" fill="#e8a50c"/><text x="370" y="235" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="370" dy="0">2</tspan></text><text x="358" y="280" font-size="22" font-weight="800" fill="#fff" text-anchor="start"><tspan x="358" dy="0">Workflow + AI</tspan></text><text x="358" y="314" font-size="19" font-weight="400" fill="#d4efe3" text-anchor="start"><tspan x="358" dy="0">Code sets the path;</tspan><tspan x="358" dy="25.650000000000002">the model handles</tspan><tspan x="358" dy="25.650000000000002">language tasks.</tspan></text><line x1="582" y1="289.475" x2="618" y2="289.475" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="622" y="192" width="242" height="194.95" rx="14" fill="#176c4f" stroke="#176c4f" stroke-width="2"/><circle cx="656" cy="228" r="16" fill="#e8a50c"/><text x="656" y="235" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="656" dy="0">3</tspan></text><text x="644" y="280" font-size="22" font-weight="800" fill="#fff" text-anchor="start"><tspan x="644" dy="0">Single agent</tspan></text><text x="644" y="314" font-size="19" font-weight="400" fill="#d4efe3" text-anchor="start"><tspan x="644" dy="0">The model chooses</tspan><tspan x="644" dy="25.650000000000002">steps and tools</tspan><tspan x="644" dy="25.650000000000002">within limits.</tspan></text><line x1="868" y1="289.475" x2="904" y2="289.475" stroke="#5b6b63" stroke-width="3" marker-end="url(#arr)"/><rect x="908" y="192" width="242" height="194.95" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><circle cx="942" cy="228" r="16" fill="#176c4f"/><text x="942" y="235" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="942" dy="0">4</tspan></text><text x="930" y="280" font-size="22" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="930" dy="0">Multi-agent</tspan></text><text x="930" y="314" font-size="19" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="930" dy="0">Agents coordinate.</tspan><tspan x="930" dy="25.650000000000002">Most flexible,</tspan><tspan x="930" dy="25.650000000000002">hardest to control.</tspan></text><rect x="50" y="426.95" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="462.95" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Start on the left. Move right only when a simpler design fails a real test.</tspan></text>
</svg>
