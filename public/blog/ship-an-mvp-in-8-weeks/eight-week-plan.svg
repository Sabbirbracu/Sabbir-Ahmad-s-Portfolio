<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690.2" width="1200" height="690.2" role="img" aria-label="Eight-week MVP timeline in four phases: discover and scope, build the core loop, harden and connect, launch and learn" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Eight-week MVP timeline in four phases: discover and scope, build the core loop, harden and connect, launch and learn</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="688.2" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">An eight-week MVP plan</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Four two-week phases, each ending with something you can show</tspan></text><line x1="70" y1="170" x2="1130" y2="170" stroke="#176c4f" stroke-width="5" stroke-linecap="round"/><circle cx="86" cy="170" r="16" fill="#176c4f" stroke="#fff" stroke-width="4"/><rect x="50" y="204" width="257" height="348.2" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="74" y="244" font-size="15" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="74" dy="0">WEEKS 1-2</tspan></text><text x="74" y="278" font-size="24" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="74" dy="0">Discover and</tspan><tspan x="74" dy="30">scope</tspan></text><circle cx="80" cy="344" r="4" fill="#176c4f"/><text x="96" y="350" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Talk to real</tspan><tspan x="96" dy="24.7">target users</tspan></text><circle cx="80" cy="405.4" r="4" fill="#176c4f"/><text x="96" y="411.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Choose the one</tspan><tspan x="96" dy="24.7">core workflow</tspan></text><circle cx="80" cy="466.79999999999995" r="4" fill="#176c4f"/><text x="96" y="472.79999999999995" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Write the cut list</tspan></text><circle cx="367" cy="170" r="16" fill="#176c4f" stroke="#fff" stroke-width="4"/><rect x="331" y="204" width="257" height="348.2" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="355" y="244" font-size="15" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="355" dy="0">WEEKS 3-4</tspan></text><text x="355" y="278" font-size="24" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="355" dy="0">Build the core</tspan><tspan x="355" dy="30">loop</tspan></text><circle cx="361" cy="344" r="4" fill="#176c4f"/><text x="377" y="350" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Sign-up to value,</tspan><tspan x="377" dy="24.7">end to end</tspan></text><circle cx="361" cy="405.4" r="4" fill="#176c4f"/><text x="377" y="411.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Ugly but working</tspan></text><circle cx="361" cy="442.09999999999997" r="4" fill="#176c4f"/><text x="377" y="448.09999999999997" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="377" dy="0">Demo every week</tspan></text><circle cx="648" cy="170" r="16" fill="#176c4f" stroke="#fff" stroke-width="4"/><rect x="612" y="204" width="257" height="348.2" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="636" y="244" font-size="15" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="636" dy="0">WEEKS 5-6</tspan></text><text x="636" y="278" font-size="24" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="636" dy="0">Harden and</tspan><tspan x="636" dy="30">connect</tspan></text><circle cx="642" cy="344" r="4" fill="#176c4f"/><text x="658" y="350" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Payments or</tspan><tspan x="658" dy="24.7">contact path</tspan></text><circle cx="642" cy="405.4" r="4" fill="#176c4f"/><text x="658" y="411.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">Errors, emails,</tspan><tspan x="658" dy="24.7">edge cases</tspan></text><circle cx="642" cy="466.79999999999995" r="4" fill="#176c4f"/><text x="658" y="472.79999999999995" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="658" dy="0">A small group of</tspan><tspan x="658" dy="24.7">real users</tspan></text><circle cx="929" cy="170" r="16" fill="#e8a50c" stroke="#fff" stroke-width="4"/><rect x="893" y="204" width="257" height="348.2" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><text x="917" y="244" font-size="15" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="917" dy="0">WEEKS 7-8</tspan></text><text x="917" y="278" font-size="24" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="917" dy="0">Launch and</tspan><tspan x="917" dy="30">learn</tspan></text><circle cx="923" cy="344" r="4" fill="#176c4f"/><text x="939" y="350" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">Launch to a</tspan><tspan x="939" dy="24.7">defined audience</tspan></text><circle cx="923" cy="405.4" r="4" fill="#176c4f"/><text x="939" y="411.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">Watch what people</tspan><tspan x="939" dy="24.7">actually do</tspan></text><circle cx="923" cy="466.79999999999995" r="4" fill="#176c4f"/><text x="939" y="472.79999999999995" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="939" dy="0">Decide what to</tspan><tspan x="939" dy="24.7">build next</tspan></text><rect x="50" y="588.2" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="624.2" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Dates will slip. The cut list is what keeps the launch date.</tspan></text>
</svg>
