<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 549.5" width="1200" height="549.5" role="img" aria-label="Three columns for sorting features: build now, do by hand, and not yet" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Three columns for sorting features: build now, do by hand, and not yet</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b63"/></marker>
  <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#176c4f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="547.5" rx="18" fill="#f6f9f7" stroke="#cfd9d4" stroke-width="2"/>
<text x="50" y="62" font-size="32" font-weight="800" fill="#17211c" text-anchor="start"><tspan x="50" dy="0">Sorting every feature request</tspan></text><text x="50" y="98" font-size="21" font-weight="400" fill="#5b6b63" text-anchor="start"><tspan x="50" dy="0">Most ideas belong in the second or third column</tspan></text><rect x="50" y="130" width="350.6666666666667" height="281.5" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="50" y="130" width="350.6666666666667" height="10" rx="5" fill="#176c4f" opacity="0.9"/><text x="74" y="182" font-size="25" font-weight="800" fill="#176c4f" text-anchor="start"><tspan x="74" dy="0">Build now</tspan></text><text x="74" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="74" dy="0">Needed to test the idea</tspan></text><circle cx="80" cy="236.3" r="4" fill="#176c4f"/><text x="96" y="242" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">The one workflow that proves</tspan><tspan x="96" dy="24.7">the idea</tspan></text><circle cx="80" cy="297.7" r="4" fill="#176c4f"/><text x="96" y="303.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">Sign-up and login</tspan></text><circle cx="80" cy="334.4" r="4" fill="#176c4f"/><text x="96" y="340.09999999999997" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="96" dy="0">A way to get paid or get in</tspan><tspan x="96" dy="24.7">touch</tspan></text><rect x="424.6666666666667" y="130" width="350.6666666666667" height="281.5" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="424.6666666666667" y="130" width="350.6666666666667" height="10" rx="5" fill="#ecd08a" opacity="0.9"/><text x="448.6666666666667" y="182" font-size="25" font-weight="800" fill="#9a6a00" text-anchor="start"><tspan x="448.6666666666667" dy="0">Do by hand</tspan></text><text x="448.6666666666667" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="448.6666666666667" dy="0">Manual first, automate later</tspan></text><circle cx="454.6666666666667" cy="236.3" r="4" fill="#ecd08a"/><text x="470.6666666666667" y="242" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="470.6666666666667" dy="0">Onboarding emails</tspan></text><circle cx="454.6666666666667" cy="273" r="4" fill="#ecd08a"/><text x="470.6666666666667" y="278.7" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="470.6666666666667" dy="0">Reports and exports</tspan></text><circle cx="454.6666666666667" cy="309.7" r="4" fill="#ecd08a"/><text x="470.6666666666667" y="315.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="470.6666666666667" dy="0">Anything a spreadsheet can</tspan><tspan x="470.6666666666667" dy="24.7">run</tspan></text><rect x="799.3333333333334" y="130" width="350.6666666666667" height="281.5" rx="14" fill="#ffffff" stroke="#cfd9d4" stroke-width="2"/><rect x="799.3333333333334" y="130" width="350.6666666666667" height="10" rx="5" fill="#e7b9af" opacity="0.9"/><text x="823.3333333333334" y="182" font-size="25" font-weight="800" fill="#c2412d" text-anchor="start"><tspan x="823.3333333333334" dy="0">Not yet</tspan></text><text x="823.3333333333334" y="210" font-size="17" font-weight="600" fill="#5b6b63" text-anchor="start"><tspan x="823.3333333333334" dy="0">Interesting, but premature</tspan></text><circle cx="829.3333333333334" cy="236.3" r="4" fill="#e7b9af"/><text x="845.3333333333334" y="242" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="845.3333333333334" dy="0">Admin dashboards</tspan></text><circle cx="829.3333333333334" cy="273" r="4" fill="#e7b9af"/><text x="845.3333333333334" y="278.7" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="845.3333333333334" dy="0">Settings and preferences</tspan></text><circle cx="829.3333333333334" cy="309.7" r="4" fill="#e7b9af"/><text x="845.3333333333334" y="315.4" font-size="19" font-weight="400" fill="#17211c" text-anchor="start"><tspan x="845.3333333333334" dy="0">Integrations nobody asked</tspan><tspan x="845.3333333333334" dy="24.7">for</tspan></text><rect x="50" y="447.5" width="1100" height="66" rx="12" fill="#13251d" stroke="#13251d" stroke-width="2"/><text x="600" y="483.5" font-size="21" font-weight="600" fill="#cfeee0" text-anchor="middle"><tspan x="600" dy="0">Doing it by hand for your first customers shows you exactly what is worth automating.</tspan></text>
</svg>
